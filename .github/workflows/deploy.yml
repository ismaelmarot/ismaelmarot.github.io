name: Deploy portfolio to GitHub Pages

# This repository is the one GitHub serves at https://ismaelmarot.github.io/, so it holds the
# deployment workflow. The site source lives in ismaelmarot-web_2.0 and is checked out here,
# which keeps this repository as pure output and the source repository as pure source.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Amendment 2. The contribution calendar is a build artefact, so it only refreshed when something
  # was pushed, and FR-016 now compares each cell against the visitor's current date. Left without
  # this, the comparison would keep describing a day that had already passed.
  # 03:15 UTC is not an arbitrary hour. A reader in UTC-3 enters a new local day at 03:00 UTC, so
  # this offset means there is never a moment when their own day is absent from the data, which is
  # the one case that leaves the label unrendered under FR-017.
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site source
        uses: actions/checkout@v4
        with:
          repository: ismaelmarot/ismaelmarot-web_2.0
          ref: main
          path: site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Fetch GitHub data
        run: npm run fetch:github
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build project
        run: npm run build
        working-directory: site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
