name: Deploy portfolio to GitHub Pages

# This repository is the one GitHub serves at https://ismaelmarot.github.io/, so it holds the
# deployment workflow. The site source lives in ismaelmarot-web_2.0 and is checked out here,
# which keeps this repository as pure output and the source repository as pure source.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Amendment 2. The contribution calendar is a build artefact, so it only refreshed when something
  # was pushed, and FR-016 now compares each cell against the visitor's current date. Left without
  # this, the comparison would keep describing a day that had already passed.
  #
  # Amendment 3 (specs/019-contribution-freshness). The hour this ran at was 03:15 UTC, and the
  # reasoning for it was sound: a reader in UTC-3 enters a new local day at 03:00 UTC, so fetching just
  # after that means their day is never absent from the data.
  #
  # Measured, it never ran at 03:15. GitHub's scheduler queues scheduled workflows, and the five most
  # recent runs started at 08:37Z, 09:44Z, 09:55Z, 10:28Z and 10:40Z against a declared 03:15: a delay
  # of five and a half to seven and a half hours, every time. So the fetch was landing six to eight
  # hours INTO the reader's day rather than at its edge, and every contribution made after roughly
  # 09:00 UTC waited a full day to appear. A visitor opening the page at 18:00 saw "sin contribuciones"
  # about a day that had six.
  #
  # Every four hours shortens that window to something a person can reason about. It does not bound it,
  # because the queue delay is GitHub's and not ours: a run can still start late, and a late run still
  # means the data is old. That is why specs/019 also makes the page state the hour it read the
  # calendar. The schedule reduces how often a visitor is misled. The label is what makes the site
  # correct.
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site source
        uses: actions/checkout@v4
        with:
          repository: ismaelmarot/ismaelmarot-web_2.0
          ref: main
          path: site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Fetch GitHub data
        run: npm run fetch:github
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build project
        run: npm run build
        working-directory: site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
